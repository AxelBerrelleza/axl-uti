# Orca worktree configuration.
# `setup` runs automatically after each new worktree is created (repo hook
# policy is "run-by-default"). It gives every worktree its own isolated
# Python environment using uv (bootstrapped via pip since uv is not yet
# installed when a fresh worktree is created).
#
# Gitignored essentials (.env, symbols.json) are copied into new worktrees
# via .worktreeinclude — see that file.
scripts:
  setup: |
    .venv/bin/pip install --quiet uv
    .venv/bin/uv sync --extra dev
