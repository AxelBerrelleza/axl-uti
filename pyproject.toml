[project]
name = "axl-uti"
version = "0.1.0"
description = "Financial data collection, stock analysis, comparison, and automation utilities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Axel Berrelleza" }
]
dependencies = [
    "click>=8.1.8,<8.2.0",
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "et-xmlfile>=2.0.0",
    "fonttools>=4.63.0",
    "idna>=3.10",
    "kiwisolver>=1.5.1",
    "markdown-it-py>=3.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "pygments>=2.19.1",
    "pyparsing>=3.2.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "shellingham>=1.5.4",
    "typer>=0.15.1,<0.16.0",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "requests-mock>=1.12.1",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-requests>=2.32.0.20241016",
    "types-python-dateutil>=2.9.0.20241206",
    "types-openpyxl>=3.1.5.20241221",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["commands*", "stockstory*"]

# ==============================================================================
# Ruff Configuration (Formatting & Linting)
# ==============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modern Python 3.12+ syntax)
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "TCH",   # flake8-type-checking
]
ignore = [
    "E501",  # Line too long (handled by ruff format)
    "B008",  # Do not perform function calls in argument defaults (needed for Typer)
    "B904",  # Within an except clause, raise exceptions with from err
    "B905",  # zip() without an explicit strict= parameter
    "RUF012", # Mutable default value for class attribute
    "SIM113", # Use enumerate() for index variable in for loop
    "SIM117", # Combine nested with statements
]

[tool.ruff.lint.isort]
known-first-party = ["commands", "stockstory"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==============================================================================
# Mypy Configuration (Static Analysis & Type Checking)
# ==============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "matplotlib.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "commands.tests.*"
ignore_errors = true

# ==============================================================================
# Pytest Configuration
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["commands/tests"]
log_cli = true
log_cli_level = "INFO"
addopts = "-v --tb=short"
